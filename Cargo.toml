[workspace]
resolver = "2"
exclude = ["crates/evaporchain-crypto-wasm"]
members = [
    "crates/evaporchain-types",
    "crates/evaporchain-energy-kernel",
    "crates/evaporchain-demurrage",
    "crates/evaporchain-padic",
    "crates/evaporchain-tropical",
    "crates/evaporchain-fee-controller",
    "crates/evaporchain-sanov-slashing",
    "crates/evaporchain-cfm",
    "crates/evaporchain-boltzmann-stake",
    "crates/evaporchain-refresh-market",
    "crates/evaporchain-refresh-patronage",
    "crates/evaporchain-script-lad",
    "crates/evaporchain-tur-liveness",
    "crates/evaporchain-light-cone",
    "crates/evaporchain-antichain-mempool",
    "crates/evaporchain-mcc",
    "crates/evaporchain-causal-cone",
    "crates/evaporchain-epv",
    "crates/evaporchain-llsa",
    "crates/evaporchain-cmu-gate",
    "crates/evaporchain-cslc",
    "crates/evaporchain-lambda-fold",
    "crates/evaporchain-mdl-shard",
    "crates/evaporchain-decay-lamport",
    "crates/evaporchain-modular-beacon",
    "crates/evaporchain-efh",
    "crates/evaporchain-prp",
    "crates/evaporchain-evap-fork-cert",
    "crates/evaporchain-lad-vm",
    "crates/evaporchain-decay-forget",
    "crates/evaporchain-allen-decay",
    "crates/evaporchain-eb-fs",
    "crates/evaporchain-hot-cold-stake",
    "crates/evaporchain-hlwa",
    "crates/evaporchain-pnt",
    "crates/evaporchain-hlts",
    "crates/evaporchain-dsn",
    "crates/evaporchain-etlp",
    "crates/evaporchain-cone-bridge",
    "crates/evaporchain-singh-attractor",
    "crates/evaporchain-bell-beacon",
    "crates/evaporchain-eg-fss",
    "crates/evaporchain-entropic-slashing",
    "crates/evaporchain-tombstone",
    "crates/evaporchain-mortis",
    "crates/evaporchain-sentinel",
    "crates/evaporchain-mera",
    "crates/evaporchain-crooks-mev-refund",
    "crates/evaporchain-braid-sequencer",
    "crates/evaporchain-hbct",
    "crates/evaporchain-hbct-elexon",
    "crates/evaporchain-self-annealing",
    "crates/evaporchain-ib-validators",
    "crates/evaporchain-wsbf",
    "crates/evaporchain-rg-phase-map",
    "crates/evaporchain-autopoietic",
    "crates/evaporchain-crypto",
    "crates/evaporchain-state",
    "crates/evaporchain-consensus",
    "crates/evaporchain-contracts",
    "crates/evaporchain-execution",
    "crates/evaporchain-proving",
    "crates/evaporchain-network",
    "crates/evaporchain-node",
    "crates/evaporchain-da",
    "crates/evaporchain-cli",
    "crates/evaporchain-script",
    "crates/evaporchain-mcp",
    "crates/evaporchain-oracle",
    "crates/evaporchain-sharding",
    "prototypes/fold-a-block",
    "wallet",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ss1738/EvaporChain"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.50.0", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
anyhow = "=1.0.102"
thiserror = "=1.0.69"
rand = "=0.8.5"
hex = "=0.4.3"
rocksdb = "=0.22.0"
bincode = "=1.3.3"
blake3 = "=1.8.3"
