[package]
name = "fold-a-block"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "EvaporChain go/no-go prototype: Nova IVC folding benchmark"

[dependencies]
nova-snark = { version = "0.68", features = ["test-utils"] }
ff = "0.13"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# NOTE: a `[profile.release]` block previously lived here with
# `opt-level=3 / lto=fat / codegen-units=1` for the Nova benchmark.
# Cargo ignores `[profile.*]` in non-root members of a workspace, so
# the block was warn-only. Default release is opt-level=3 which is
# what the prototype needs; lto/codegen-units belong in the workspace
# root if globally desired, not here.
