[package]
name = "fold-a-block"
version = "0.1.0"
edition = "2021"
description = "EvaporChain go/no-go prototype: Nova IVC folding benchmark"

[dependencies]
nova-snark = "0.68"
ff = "0.13"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
