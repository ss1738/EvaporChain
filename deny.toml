# cargo-deny configuration. Schema v2 — see
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# v2 sets sensible defaults (vulnerability=deny, unmaintained=warn,
# yanked=warn, notice=warn, unlicensed=deny, copyleft=denied-by-omission
# from `allow`), so the explicit keys that used to live here are removed.
# Only deviations from default are declared.

[advisories]
version = 2

[licenses]
version = 2
# Anything not in this list is denied — replaces the old `copyleft = "deny"`
# and `unlicensed = "deny"` keys (now implicit in v2).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
