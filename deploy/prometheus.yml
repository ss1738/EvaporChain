global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "evaporchain"
    static_configs:
      # Docker Compose devnet
      - targets:
          - "validator-0:8080"
          - "validator-1:8080"
          - "validator-2:8080"
          - "validator-3:8080"
        labels:
          network: "devnet"

    # Kubernetes service discovery (uncomment for k8s)
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names: ["evaporchain"]
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
    #     action: keep
    #     regex: true
    #   - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
    #     action: replace
    #     target_label: __address__
    #     regex: (.+)
    #     replacement: ${1}:$1

    metrics_path: "/metrics"
    scheme: "http"
