---
# Validator key secrets — one per validator.
# In production, populate via:
#   kubectl create secret generic validator-0-keys \
#     --from-file=validator-key.pem=./tls-certs/validator0-key.pem \
#     --from-file=validator-cert.pem=./tls-certs/validator0-cert.pem \
#     --from-file=node-key=./keys/validator0-node-key \
#     -n evaporchain
#
# For HashiCorp Vault integration, replace with ExternalSecret or
# Vault Agent sidecar annotations.

apiVersion: v1
kind: Secret
metadata:
  name: validator-0-keys
  namespace: evaporchain
  labels:
    app.kubernetes.io/name: evaporchain
    app.kubernetes.io/component: validator
    validator-ordinal: "0"
type: Opaque
data: {}
# Populate with:
#   validator-key.pem: <base64-encoded TLS private key>
#   validator-cert.pem: <base64-encoded TLS certificate>
#   node-key: <base64-encoded libp2p identity key>

---
apiVersion: v1
kind: Secret
metadata:
  name: validator-1-keys
  namespace: evaporchain
  labels:
    app.kubernetes.io/name: evaporchain
    app.kubernetes.io/component: validator
    validator-ordinal: "1"
type: Opaque
data: {}

---
apiVersion: v1
kind: Secret
metadata:
  name: validator-2-keys
  namespace: evaporchain
  labels:
    app.kubernetes.io/name: evaporchain
    app.kubernetes.io/component: validator
    validator-ordinal: "2"
type: Opaque
data: {}

---
apiVersion: v1
kind: Secret
metadata:
  name: validator-3-keys
  namespace: evaporchain
  labels:
    app.kubernetes.io/name: evaporchain
    app.kubernetes.io/component: validator
    validator-ordinal: "3"
type: Opaque
data: {}

---
# CA certificate — shared across all validators for mTLS verification
apiVersion: v1
kind: Secret
metadata:
  name: evaporchain-ca
  namespace: evaporchain
  labels:
    app.kubernetes.io/name: evaporchain
type: Opaque
data: {}
# Populate with:
#   ca-cert.pem: <base64-encoded CA certificate>
