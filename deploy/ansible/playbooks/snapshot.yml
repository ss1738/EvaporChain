---
# Take a state snapshot on every validator and rsync it back to the
# operator's backup host.
#
# Calls the native `evaporchain snapshot create` subcommand, which writes
# a SnapshotFile (`.zst` blob with magic header `EVSN`) at
# `{{ snapshot_local_path }}`. The blob is the same format served by
# `/api/snapshot/download/:height` and consumed by a fast-syncing peer
# via `--fast-sync <peer-url>` — i.e. this rsync'd backup is directly
# replayable into a fresh node by `evaporchain snapshot apply --input
# <path> --data-dir <new-dir>`.
#
# The CLI hits the live RocksDB data dir, so we briefly stop the node
# to avoid the single-writer lock conflict; once we move the snapshot
# generation to a node-internal `/api/snapshot/create` endpoint this
# stop/start can go away.
#
# Usage:
#   ansible-playbook playbooks/snapshot.yml --ask-vault-pass
- name: Snapshot EvaporChain validator state
  hosts: validators
  become: true
  gather_facts: true
  serial: 1     # one validator at a time so we never lose quorum
  any_errors_fatal: false
  vars_files:
    - ../group_vars/vault.yml
  vars:
    snapshot_filename: "snapshot-{{ inventory_hostname }}-{{ ansible_date_time.epoch }}.zst"
    snapshot_local_path: "{{ snapshot_dir }}/{{ snapshot_filename }}"
  tasks:
    - name: Ensure snapshot dir exists
      ansible.builtin.file:
        path: "{{ snapshot_dir }}"
        state: directory
        owner: "{{ evaporchain_user }}"
        group: "{{ evaporchain_group }}"
        mode: "0750"

    - name: Stop service for consistent snapshot
      ansible.builtin.systemd:
        name: evaporchain-node
        state: stopped
      register: stop_result

    - name: Take native SnapshotFile via evaporchain snapshot create
      ansible.builtin.command:
        argv:
          - "{{ cli_path }}"
          - snapshot
          - create
          - --data-dir
          - "{{ data_dir }}/state"
          - --output
          - "{{ snapshot_local_path }}"
          - --chain-id
          - "{{ chain_id }}"
        creates: "{{ snapshot_local_path }}"
      become_user: "{{ evaporchain_user }}"

    - name: Fix ownership/mode on snapshot file
      ansible.builtin.file:
        path: "{{ snapshot_local_path }}"
        owner: "{{ evaporchain_user }}"
        group: "{{ evaporchain_group }}"
        mode: "0640"

    - name: Restart service after snapshot
      ansible.builtin.systemd:
        name: evaporchain-node
        state: started
      when: stop_result.changed

    - name: Wait for /api/status to return 200 after restart
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}{{ health_endpoint }}"
        status_code: 200
      register: health
      retries: "{{ (health_timeout_seconds / health_poll_interval_seconds) | int }}"
      delay: "{{ health_poll_interval_seconds }}"
      until: health.status == 200
      changed_when: false

    - name: Compute snapshot checksum
      ansible.builtin.shell: |
        set -euo pipefail
        sha256sum '{{ snapshot_local_path }}' > '{{ snapshot_local_path }}.sha256'
      args:
        executable: /bin/bash
      changed_when: true

    - name: Rsync snapshot to backup host
      ansible.builtin.shell: |
        set -euo pipefail
        rsync -avz \
          -e 'ssh -o StrictHostKeyChecking=accept-new' \
          '{{ snapshot_local_path }}' \
          '{{ snapshot_local_path }}.sha256' \
          '{{ snapshot_backup_user }}@{{ snapshot_backup_host }}:{{ snapshot_backup_path }}/'
      args:
        executable: /bin/bash
      when:
        - snapshot_backup_host != "REPLACE_ME_BACKUP_HOST"
        - snapshot_backup_user != "REPLACE_ME_BACKUP_USER"
        - snapshot_backup_path != "REPLACE_ME_BACKUP_PATH"
      changed_when: true

    - name: Warn when backup host is still a placeholder
      ansible.builtin.debug:
        msg: >-
          snapshot_backup_host is still REPLACE_ME — snapshot taken
          locally at {{ snapshot_local_path }} but not uploaded.
      when: snapshot_backup_host == "REPLACE_ME_BACKUP_HOST"

    - name: Prune old local snapshots (keep newest {{ snapshot_retain_count }})
      ansible.builtin.shell: |
        set -euo pipefail
        cd '{{ snapshot_dir }}'
        # Native SnapshotFile blobs (`.zst` from `evaporchain snapshot create`)
        ls -1t snapshot-*.zst 2>/dev/null \
          | tail -n +$((1 + {{ snapshot_retain_count }})) \
          | xargs -r rm -f
        ls -1t snapshot-*.zst.sha256 2>/dev/null \
          | tail -n +$((1 + {{ snapshot_retain_count }})) \
          | xargs -r rm -f
        # Legacy tar.zst blobs from the pre-CLI fallback (kept clean).
        ls -1t snapshot-*.tar.zst 2>/dev/null \
          | tail -n +$((1 + {{ snapshot_retain_count }})) \
          | xargs -r rm -f
        ls -1t snapshot-*.tar.zst.sha256 2>/dev/null \
          | tail -n +$((1 + {{ snapshot_retain_count }})) \
          | xargs -r rm -f
      args:
        executable: /bin/bash
      changed_when: false
