groups:
  - name: evaporchain-operator
    rules:
      - alert: EvapNodeDown
        expr: up{job="evaporchain"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "EvaporChain node is unreachable"
          description: "{{ $labels.instance }} has not responded to /metrics scrapes for 2+ minutes."

      - alert: EvapBlockProductionStalled
        expr: rate(evap_block_height[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Block production has stalled"
          description: "{{ $labels.instance }} has produced no new blocks in the last 5 minutes."

      - alert: EvapValidatorOffline
        expr: evap_active_validators < 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Validator set below 3-node quorum"
          description: "{{ $labels.instance }} sees only {{ $value }} active validators (3-node cluster expected)."

      - alert: EvapPeerCountLow
        expr: evap_peer_count < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Peer count is below the safe floor"
          description: "{{ $labels.instance }} has only {{ $value }} peers; partition risk is rising."

      - alert: EvapMempoolBacklog
        expr: evap_mempool_size > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mempool backlog detected"
          description: "{{ $labels.instance }} has {{ $value }} txs queued; block proposers may be falling behind."

      - alert: EvapBellBeaconUncertified
        expr: evap_bell_s_value_milli < 2000
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Bell-Certified Beacon below local-realism bound"
          description: "{{ $labels.instance }} reports CHSH S = {{ $value }} milli; not Bell-certified for 30+ minutes."

      - alert: EvapFinalityStalled
        expr: evap_worst_unfinalised_gap_seconds > 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "EvaporChain finality stalled"
          description: "Worst unfinalised height has been waiting {{ $value }}s for finality (>30s threshold)"

      - alert: EvapHighInboundRejectRate
        expr: rate(evap_inbound_rejections_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained inbound libp2p rejections — possible Sybil pressure"
          description: "{{ $labels.instance }} is rejecting >10 inbound peer connections/sec for 5+ minutes (reason={{ $labels.reason }}). Investigate per-IP / per-subnet caps and the active ban list."
