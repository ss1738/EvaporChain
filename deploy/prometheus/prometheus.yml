global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'evaporchain'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'satyawan.local:8080'
          - 'apsarth.local:8080'
          - 'ironman.local:8080'
        labels:
          cluster: 'evaporchain-3node'
          env: 'testnet'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'satyawan.local:9100'
          - 'apsarth.local:9100'
          - 'ironman.local:9100'
        labels:
          cluster: 'evaporchain-3node'
          env: 'testnet'
