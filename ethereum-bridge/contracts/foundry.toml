[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "prague"  # required for EIP-2537 BLS12-381 precompiles
gas_reports = ["CommitCertVerifier", "VerkleProofVerifier", "EvaporationDispatcher"]
ffi = false
fs_permissions = [{ access = "read", path = "./fixtures" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
