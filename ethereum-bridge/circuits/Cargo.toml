[workspace]
# Standalone workspace — heavy proving deps stay out of the 147-crate parent.
# Build with `cargo build` from this directory (on a Mini).

[package]
name = "evaporchain-verkle-circuits"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Verkle membership IVC circuit for the EvaporChain → Ethereum bridge (Phase 4 full)"

[[bin]]
name = "verkle-prove"
path = "src/bin/prove.rs"

[lib]
name = "evaporchain_verkle_circuits"
path = "src/lib.rs"

[dependencies]
nova-snark    = { version = "0.68", features = ["test-utils"] }
ff            = "0.13"
generic-array = "1"
blake3        = "1"
serde         = { version = "1", features = ["derive"] }
hex           = "0.4"
flate2        = "1"
bincode       = { version = "2", features = ["serde"] }
serde_json    = "1"

# T0.9 (Bridge V2) — Halo2 EccChip in-circuit Pallas MSM. Optional
# feature so the default build (V1 Poseidon binding) stays unchanged
# until the V2 path is wired through to the prover. halo2_proofs +
# halo2_gadgets pull in pasta_curves which is already transitively
# present via nova-snark, so no curve/ff version split.
halo2_proofs   = { version = "0.3", optional = true }
halo2_gadgets  = { version = "0.3", optional = true }
pasta_curves   = { version = "0.5", optional = true }

[features]
default = []
# T0.9 sub-task A — compiles the EccVerkleStepCircuit V2 scaffold
# alongside the existing V1 Poseidon binding. Off by default so
# CI / `cargo test` stays at the existing 8 V1 tests until the V2
# path is wired all the way through to the prover.
v2-ecc = ["halo2_proofs", "halo2_gadgets", "pasta_curves"]

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
