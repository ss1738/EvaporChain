[workspace]
# Standalone workspace, deliberately separate from the EvaporChain root —
# the alloy/ethers stack is heavy and the parent workspace is already at
# 147+ crates. Build with `cargo build` from this directory.

[package]
name = "evaporchain-eth-relayer"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Permissionless relayer that publishes EvaporChain finalised headers to the Ethereum-side EvaporHeaderInbox contract. See ETHEREUM_BRIDGE_PLAN.md Phase 3b."

[dependencies]
evaporchain-eth-bridge = { path = "../../crates/evaporchain-eth-bridge" }

# Async runtime + HTTP polling against the EvaporChain JSON API.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Ethereum side.
alloy = { version = "0.8", features = ["full", "node-bindings", "signer-local", "json-rpc", "rpc-types-eth"] }

# Logging + errors.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[[bin]]
name = "evaporchain-eth-relayer"
path = "src/main.rs"

[dev-dependencies]
# Anvil-driven end-to-end test helpers.
bls12_381 = { version = "0.8", default-features = false, features = ["pairings", "alloc", "groups", "experimental"] }
group = { version = "0.13", default-features = false, features = ["alloc"] }
sha2_old_for_bls = { package = "sha2", version = "=0.9.9" }
sha3 = "0.10"
serde_json = "1"
hex = "0.4"
