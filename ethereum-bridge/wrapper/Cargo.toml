[workspace]
# Standalone workspace — keeps the arkworks/Groth16 stack out of both
# the 147-crate parent workspace AND the Halo2-using
# `ethereum-bridge/circuits/` standalone workspace. Two separate proof
# systems, two separate dependency graphs.

[package]
name = "evaporchain-verkle-wrapper"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "T0.10 sub-B — Halo2-IPA-in-BN254 Groth16 wrapper circuit for the EvaporChain → Ethereum bridge"

[lib]
name = "evaporchain_verkle_wrapper"
path = "src/lib.rs"

[[bin]]
name = "wrapper-prove"
path = "src/bin/prove.rs"

[dependencies]
# Groth16 over BN254 — the L1 Solidity verifier consumes a 256-byte
# Groth16 proof (A:64 + B:128 + C:64) via the EIP-197 pairing
# precompile, so BN254 is mandatory on this side.
ark-bn254       = "0.5"
ark-ec          = "0.5"
ark-ff          = "0.5"
ark-groth16     = { version = "0.5", default-features = false, features = ["parallel"] }
ark-r1cs-std    = { version = "0.5", default-features = false }
ark-relations   = "0.5"
ark-serialize   = "0.5"
ark-snark       = "0.5"
ark-std         = "0.5"
# T0.10 sub-B non-native gadget scaffold — `ark_pallas::Fq` is the stand-in
# target field for in-circuit Halo2 IPA arithmetic. The eventual sub-B-finish
# bridges this to `pasta_curves::pallas::Base` via Montgomery-form byte
# reinterpretation (both fields share the same modulus — they're literally
# the same field, just two different Rust type-system encodings of it).
ark-pallas      = "0.5"

# Cross-side fixture interchange — matches the schema written by
# `verkle-fixture-emit` in the sister `circuits/` workspace.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
hex        = "0.5"
blake3     = "1"
thiserror  = "1"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
