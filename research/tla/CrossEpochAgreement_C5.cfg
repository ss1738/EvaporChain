\* CrossEpochAgreement — C5 ENFORCEABLE-RULE verification.
\* Tests: delayed stake activation (frozen stayers) + stayers>2/3 stake in both
\* epochs, under tightened Byzantine f<1/4 (ByzDen=4). If HonestQuorumIntersection
\* holds, the rule the EpochTransitionManager can actually enforce is sufficient.
CONSTANTS
    AllValidators = {v0, v1, v2, v3, v4}
    StakeValues = {1, 2, 3}
    MinValidators = 3
    EnforceStakeOverlap = FALSE
    EnforceC5 = TRUE
    ByzDen = 4
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ByzantineBoundBothEpochs
INVARIANT HonestQuorumIntersection
