\* EvaporChainBFT Byzantine Model Configuration
\* Tests safety with 1 Byzantine validator out of 4 (f=1, n=4, 2f+1=3)
\* Run with: java -jar tla2tools.jar -config EvaporChainBFT_Byzantine.cfg EvaporChainBFT.tla

CONSTANTS
    Validators = {0, 1, 2, 3}
    MaxRound = 3
    MaxHeight = 2
    Faulty = {3}

SPECIFICATION Spec

\* Safety must hold even with 1 Byzantine validator
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
INVARIANT CommitRequiresQuorum
INVARIANT LockSafety
INVARIANT StateCommitmentIntegrity
