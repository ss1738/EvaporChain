\* EvaporChainBFT Byzantine Model Configuration
\* Tests safety with 1 Byzantine validator out of 4 (f=1, n=4, 2f+1=3)
\* Run with: java -jar tla2tools.jar -config EvaporChainBFT_Byzantine.cfg EvaporChainBFT.tla

CONSTANTS
    Validators = {0, 1, 2, 3}
    MaxRound = 3
    MaxHeight = 2
    Faulty = {3}
    \* D1/D5 fix 2026-05-21: stake-weighted quorum config that GENUINELY
    \* exercises unequal stake. Faulty validator 3 has 2 stake; honest
    \* 0/1/2 have 3 stake each. Total = 11. Faulty stake = 2;
    \* 2 * 3 = 6 < 11 ✓ (Byzantine assumption holds). Honest stake = 9;
    \* 9 * 3 = 27 > 11 * 2 = 22 ✓ (honest quorum reachable). Non-trivially
    \* different from the count threshold (count: faulty=1<4/3 = false).
    FaultyStake = 2
    HonestStake = 3

SPECIFICATION Spec

\* See EvaporChainBFT.cfg for rationale: terminal state at
\* height = MaxHeight + 1 disables all action guards by design.
CHECK_DEADLOCK FALSE

\* Safety must hold even with 1 Byzantine validator
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
INVARIANT CommitRequiresQuorum
INVARIANT LockSafety
INVARIANT StateCommitmentIntegrity
