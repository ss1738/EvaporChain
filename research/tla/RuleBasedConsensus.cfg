\* TLC configuration for RuleBasedConsensus.tla
\* Small bounded model — runs in seconds. Increase Objects, Validators,
\* and MaxEpoch for deeper coverage.

SPECIFICATION Spec

INVARIANT
    TypeOK
    QueryDeterminism
    MonotoneDecay
    BoundedByInitial
    AnchorSanity
    ReAnchorEquivalenceApprox

PROPERTY
    EventuallyQueried
    EventuallyAdvances

CONSTANTS
    Objects = {alpha, beta}
    Validators = {v0, v1, v2}
    InitialEnergy = [alpha |-> 1000, beta |-> 500]
    HalfLife = [alpha |-> 10, beta |-> 5]
    AnchorInterval = 5
    MaxEpoch = 30

CONSTRAINT
    epoch <= MaxEpoch

\* ──────────────────────────────────────────────────────────────────────
\* Suggested follow-on configurations:
\*
\*   1. Larger validator set (stress determinism check):
\*        Validators = {v0, v1, v2, v3, v4}
\*
\*   2. Adversarial half-life (forces edge cases in bit-shift):
\*        HalfLife = [alpha |-> 1, beta |-> 2]
\*        — exposes off-by-one at the halving boundary.
\*
\*   3. Long-horizon (verifies decay never goes negative):
\*        InitialEnergy = [alpha |-> 100, beta |-> 50]
\*        MaxEpoch = 200
\*        — ensures LazyEnergy correctly returns 0 past 64 halvings.
\*
\*   4. Frequent re-anchoring (stresses ReAnchorEquivalenceApprox):
\*        AnchorInterval = 1
\*        — forces every-epoch anchor; integer rounding accumulates
\*          most aggressively here.
\* ──────────────────────────────────────────────────────────────────────
