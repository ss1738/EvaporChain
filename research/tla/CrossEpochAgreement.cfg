\* CrossEpochAgreement Model Configuration.
\* Run: java -jar tla2tools.jar -config CrossEpochAgreement.cfg CrossEpochAgreement.tla
\*
\* 5 validators, stakes in {1,2,3}, min-set 3. Small enough to exhaust
\* (TLC enumerates all (setN, setN1, stakeN, stakeN1, faulty) tuples
\* satisfying the count-churn cap + Byzantine bound), large enough to
\* admit unequal stake + a high-stake validator rotating out — the case
\* that stresses count-vs-stake churn.

CONSTANTS
    AllValidators = {v0, v1, v2, v3, v4}
    StakeValues = {1, 2, 3}
    MinValidators = 3
    EnforceStakeOverlap = FALSE
    EnforceC5 = FALSE
    ByzDen = 3

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT ByzantineBoundBothEpochs
INVARIANT HonestQuorumIntersection
