\* TLC configuration for EnergyVerkleTrie.tla
\* Small bounded model — runs in seconds. Increase Leaves and MaxEpoch
\* for deeper coverage.

SPECIFICATION Spec

INVARIANT
    TypeOK
    NoHotCompressed
    CompressionPreservesLeafCount
    EnergyMonotonicityRespected

CONSTANTS
    Subtrees = {s0, s1}
    Leaves = {l0, l1, l2}
    InitialEnergy = [l0 |-> 4, l1 |-> 2, l2 |-> 6]
    DecayPerEpoch = [l0 |-> 1, l1 |-> 1, l2 |-> 1]
    LeafSubtree = [l0 |-> s0, l1 |-> s0, l2 |-> s1]
    MaxEpoch = 12

CONSTRAINT
    epoch <= MaxEpoch

\* ──────────────────────────────────────────────────────────────────────
\* Suggested follow-on configurations:
\*
\*   1. More leaves per subtree (stresses MaxEnergyOfSubtree CHOOSE):
\*        Leaves = {l0, l1, l2, l3, l4}
\*        InitialEnergy = [l0 |-> 4, l1 |-> 2, l2 |-> 6, l3 |-> 1, l4 |-> 8]
\*        DecayPerEpoch = [l0 |-> 1, l1 |-> 1, l2 |-> 1, l3 |-> 1, l4 |-> 1]
\*        LeafSubtree = [l0 |-> s0, l1 |-> s0, l2 |-> s0, l3 |-> s1, l4 |-> s1]
\*
\*   2. Variable decay rates (some leaves die fast, others slow):
\*        DecayPerEpoch = [l0 |-> 1, l1 |-> 2, l2 |-> 4]
\*        — l1 dies in 1 epoch, l0 in 4, l2 in 1 (with InitialEnergy=2..6).
\*
\*   3. Long horizon (verifies cold subtrees eventually compressed):
\*        MaxEpoch = 50
\*        — gives the action scheduler enough room to fire Compress for
\*          every cold subtree before the model ends.
\* ──────────────────────────────────────────────────────────────────────
