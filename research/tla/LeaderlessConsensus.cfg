\* LeaderlessConsensus model configuration.
\* Run: java -jar tla2tools.jar -config LeaderlessConsensus.cfg LeaderlessConsensus.tla
\*
\* n = 4 validators, f = 1 Byzantine (3*1 = 3 < 4 satisfies the BFT bound),
\* so quorum = 2f+1 = 3 = the honest count (n-f). Three competing
\* candidate blocks model leaderless multi-proposal at one height.

CONSTANTS
    Validators = {0, 1, 2, 3}
    Faulty = {3}
    Blocks = {1, 2, 3}

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT SafetyNoConflictingFinalize
INVARIANT LivenessCanonicalFinalizes
INVARIANT NonCanonicalStaysSubQuorum
