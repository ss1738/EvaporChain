\* TLC configuration for PoHA.tla
\* Small bounded model — runs in seconds. Increase Validators / Certificates
\* / MaxEpoch for deeper coverage.

SPECIFICATION Spec

INVARIANT
    TypeOK
    EnergyCappedAtInitial
    ActiveCertsHaveQuorum
    GhostsAreTerminal
    AttestersAreValidators

CONSTANTS
    Validators = {v0, v1, v2}
    Certificates = {c0, c1}
    InitialEnergy = [c0 |-> 4, c1 |-> 6]
    DecayPerEpoch = [c0 |-> 1, c1 |-> 1]
    AttestBoost   = [c0 |-> 2, c1 |-> 3]
    GracePeriod   = 2
    ValidatorStake = [v0 |-> 100, v1 |-> 100, v2 |-> 100]
    QuorumThresholdNum = 2
    QuorumThresholdDen = 3
    MaxEpoch = 15

CONSTRAINT
    epoch <= MaxEpoch

\* ──────────────────────────────────────────────────────────────────────
\* Suggested follow-on configurations:
\*
\*   1. Stake-weighted quorum (varying validator stakes):
\*        ValidatorStake = [v0 |-> 500, v1 |-> 200, v2 |-> 100]
\*        — exercises the StakeOf computation under non-uniform weights.
\*
\*   2. Multiple certificates with different decay rates:
\*        Certificates = {c0, c1, c2, c3}
\*        — verifies invariants hold under independent cert lifecycles.
\*
\*   3. Tight quorum (1-validator failure tolerance):
\*        QuorumThresholdNum = 4
\*        QuorumThresholdDen = 5
\*        — tighter quorum stresses ActiveCertsHaveQuorum.
\*
\*   4. Long horizon (more decay → ghost transitions):
\*        MaxEpoch = 50
\*        — gives scheduler enough room to fire Grace + Ghost transitions
\*          for every certificate.
\* ──────────────────────────────────────────────────────────────────────
