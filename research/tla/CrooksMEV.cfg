\* CrooksMEV Model Configuration — small, complete-able in TLC.
\* Run with: java -jar tla2tools.jar -config CrooksMEV.cfg CrooksMEV.tla

CONSTANTS
    Validators = {0}
    Attackers = {a0, a1}
    Victims = {v0}
    MaxBlockHeight = 6
    GracePeriod = 1
    RefundWindow = 3
    ConfidenceThreshold = 500
    MaxObservationsPerBlock = 1

SPECIFICATION Spec

\* Bounded model — Init reaches a terminal at currentHeight = MaxBlockHeight;
\* deadlock is by design (same convention as EvaporChainBFT cfgs).
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NoDoubleSettlement
INVARIANT DisputedNeverSettles
INVARIANT SettlementOnlyAfterGrace
INVARIANT SettlementWithinWindow
INVARIANT ConfidenceThresholdHonored
INVARIANT SettledAndExpiredDisjoint
INVARIANT VictimOptOutHonored
