\* ValidatorSetTransition Model Configuration.
\* Run: java -jar tla2tools.jar -config ValidatorSetTransition.cfg ValidatorSetTransition.tla

CONSTANTS
    AllValidators = {v0, v1, v2, v3, v4}
    MinValidators = 3
    BondingPeriod = 2
    UnbondingPeriod = 4
    MaxChurnNum = 33
    MaxChurnDen = 100
    MaxEpoch = 4
    InitialActive = {v0, v1, v2}

SPECIFICATION Spec

\* Bounded model — terminal at epoch = MaxEpoch; deadlock-by-design
\* (same convention as the other EvaporChain cfgs).
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT MinValidatorsHeld
INVARIANT ChurnBounded
INVARIANT BondingRespected
INVARIANT LeavesBlockedOnlyByFloor
