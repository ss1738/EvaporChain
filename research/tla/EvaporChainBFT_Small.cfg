\* EvaporChainBFT Small Model — fits in memory, completes in minutes
\* Run with: java -jar tla2tools.jar -config EvaporChainBFT_Small.cfg EvaporChainBFT.tla

CONSTANTS
    Validators = {0, 1, 2}
    MaxRound = 2
    MaxHeight = 2
    Faulty = {}
    FaultyStake = 1   \* D1/D5 fix 2026-05-21: stake-weighted quorum (uniform)
    HonestStake = 1

SPECIFICATION Spec

\* See EvaporChainBFT.cfg for rationale: terminal state at
\* height = MaxHeight + 1 disables all action guards by design.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
INVARIANT CommitRequiresQuorum
INVARIANT LockSafety
INVARIANT EquivocationDetected
INVARIANT StateCommitmentIntegrity
