\* CrossForkEquivocation Model Configuration — small, complete-able.
\* Run with: java -jar tla2tools.jar -config CrossForkEquivocation.cfg CrossForkEquivocation.tla

CONSTANTS
    Validators = {v0, v1}
    Tips = {t0, t1}
    Blocks = {b0, b1}
    MaxRound = 1

SPECIFICATION Spec

\* Bounded model — reaches a terminal state when all (tip, validator,
\* round) slots are filled; deadlock-by-design (same convention as the
\* other EvaporChain cfgs).
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT CrossForkEquivocationDetected
INVARIANT NoFalsePositive

PROPERTY DetectionStable
