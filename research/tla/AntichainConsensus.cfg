\* AntichainConsensus Model Configuration.
\* Run: java -jar tla2tools.jar -config AntichainConsensus.cfg AntichainConsensus.tla
\*
\* DAG fixture (defined as operators McBlocks/McAncestor/McEnergy in the
\* .tla and bound here via `<-`): TWO INDEPENDENT 2-chains, chosen so the
\* greedy result is genuinely order-dependent — which is exactly why a
\* canonical order is required for cross-validator agreement.
\*
\*     chain A:  b0 ──▶ b1        chain B:  b2 ──▶ b3
\*     energies  b0=50 b1=40            b2=30 b3=20
\*
\* Concurrent pairs: (b0,b2),(b0,b3),(b1,b2),(b1,b3).
\* Canonical greedy (b0,b1,b2,b3) → {b0,b2} (maximal, deterministic).
\* Arbitrary order b1,b3,... → {b1,b3} (maximal, DIFFERENT) ⇒ proves
\* convergence requires the canonical order.

CONSTANTS
    Blocks   <- McBlocks
    Ancestor <- McAncestor
    Energy   <- McEnergy

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT BuiltIsAntichain
INVARIANT CanonicalAgree
INVARIANT CompletedIsMaximal
INVARIANT ArbCompletedIsMaximal
