\* CrossEpochAgreement — FIX-VERIFICATION config (EnforceStakeOverlap = TRUE).
\* Run: java -jar tla2tools.jar -config CrossEpochAgreement_CandidateFix.cfg CrossEpochAgreement.tla
\*
\* Enables StakeOverlapFix (currently = C4, the frozen-honest-stayers
\* supermajority condition). RESULT: HonestQuorumIntersection HOLDS —
\* "Model checking completed. No error has been found." 850,288 distinct
\* states, queue drained to 0 (~14 min). C4 is the VERIFIED sufficient
\* condition; C1/C2/C3 (selectable in the .tla) each still violate.
\*
\* Contrast with CrossEpochAgreement.cfg (EnforceStakeOverlap = FALSE),
\* which reproduces the original cross-epoch violation.

CONSTANTS
    AllValidators = {v0, v1, v2, v3, v4}
    StakeValues = {1, 2, 3}
    MinValidators = 3
    EnforceStakeOverlap = TRUE
    EnforceC5 = FALSE
    ByzDen = 3

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT ByzantineBoundBothEpochs
INVARIANT HonestQuorumIntersection
