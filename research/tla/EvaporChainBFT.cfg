\* EvaporChainBFT Model Configuration
\* Run with: java -jar tla2tools.jar -config EvaporChainBFT.cfg EvaporChainBFT.tla

\* ── Constants ──────────────────────────────────────────────────────────
\* 3-node cluster matches the live deployment (Satyawan, Ironman, Apsarth)
CONSTANTS
    Validators = {0, 1, 2}
    MaxRound = 3
    MaxHeight = 3
    Faulty = {}
    \* D1/D5 fix 2026-05-21: stake-weighted quorum constants. Equal stake
    \* keeps the model's threshold semantics identical to the original
    \* count-based check, so existing safety arguments still hold.
    \* Non-trivial stake distribution is exercised by the Byzantine config.
    FaultyStake = 1
    HonestStake = 1

\* ── Specification ──────────────────────────────────────────────────────
SPECIFICATION Spec

\* All ProposeBlock / ReceiveProposalAndPrevote / PrevoteQuorumReached /
\* PrecommitQuorumCommit etc. are guarded by `height[v] <= MaxHeight`.
\* Once every honest validator has committed up to MaxHeight, height
\* advances to MaxHeight + 1 and no action is enabled — TLC reports
\* this terminal state as a "deadlock" by default. The terminal state
\* is the *intended* end of bounded model checking, not a bug, so we
\* disable deadlock detection. Confirmed 2026-05-05: every counter-
\* example trace ends with all validators at height MaxHeight + 1
\* with all 7 safety invariants satisfied (no Agreement / Validity /
\* CommitRequiresQuorum / LockSafety / EquivocationDetected /
\* StateCommitmentIntegrity / TypeOK violation found).
CHECK_DEADLOCK FALSE

\* ── Safety Invariants ──────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
INVARIANT CommitRequiresQuorum
INVARIANT LockSafety
INVARIANT EquivocationDetected
INVARIANT StateCommitmentIntegrity

\* ── Liveness Properties ────────────────────────────────────────────────
\* Uncomment to check liveness (requires LiveSpec and longer run time)
\* PROPERTY Progress
\* PROPERTY DAEventualAttestation
