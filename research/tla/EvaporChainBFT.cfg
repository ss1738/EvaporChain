\* EvaporChainBFT Model Configuration
\* Run with: java -jar tla2tools.jar -config EvaporChainBFT.cfg EvaporChainBFT.tla

\* ── Constants ──────────────────────────────────────────────────────────
\* 3-node cluster matches the live deployment (Satyawan, Ironman, Apsarth)
CONSTANTS
    Validators = {0, 1, 2}
    MaxRound = 3
    MaxHeight = 3
    Faulty = {}

\* ── Specification ──────────────────────────────────────────────────────
SPECIFICATION Spec

\* ── Safety Invariants ──────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
INVARIANT CommitRequiresQuorum
INVARIANT LockSafety
INVARIANT EquivocationDetected
INVARIANT StateCommitmentIntegrity

\* ── Liveness Properties ────────────────────────────────────────────────
\* Uncomment to check liveness (requires LiveSpec and longer run time)
\* PROPERTY Progress
\* PROPERTY DAEventualAttestation
