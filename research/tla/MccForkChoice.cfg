\* MccForkChoice Model Configuration — the SAFE determinism invariants
\* (each rule used consistently is deterministic). Run:
\*   java -jar tla2tools.jar -config MccForkChoice.cfg MccForkChoice.tla
\*
\* Leaves are naturals (model the total order on 32-byte block ids).
\* MaxEnergy = 2 keeps the energy-assignment space small while still
\* admitting ties (the interesting case for the tie-break analysis).

CONSTANTS
    Leaves = {0, 1, 2}
    MaxEnergy = 2

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT SelectTipDeterministic
INVARIANT MccChooseDeterministic
INVARIANT SelectTipPicksMinEnergy
