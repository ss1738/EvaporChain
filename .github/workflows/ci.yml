name: CI
on: [push, pull_request]

jobs:
  rust:
    name: Rust — check, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --check

  integration:
    name: Rust — integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p integration-tests -- --include-ignored
        timeout-minutes: 15

  audit:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Security — license & ban check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check all

  coverage:
    name: Coverage — tarpaulin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-tarpaulin
      - run: cargo tarpaulin --workspace --out xml --skip-clean --timeout 300
        timeout-minutes: 20
      - uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  wasm:
    name: WASM — build ML-DSA crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build crates/evaporchain-crypto-wasm --target web --release --out-dir ../../extension/src/crypto/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: extension/src/crypto/wasm/

  extension:
    name: Extension — typecheck and build
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: extension/src/crypto/wasm/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: extension
        run: npm ci
      - working-directory: extension
        run: npx tsc --noEmit
      - working-directory: extension
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
