name: CI

# Only fire on main branch pushes and PRs targeting main.
# Feature branch pushes are validated locally on the Minis before merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust — check, test, lint
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --check

  integration:
    name: Rust — integration tests
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p integration-tests -- --include-ignored
        timeout-minutes: 15

  audit:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Security — license & ban check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check all

  # Coverage runs weekly (Sunday 03:00 UTC) or manually — NOT on every push.
  # cargo install tarpaulin alone takes 8-10 min on GitHub hosted runners.
  coverage:
    name: Coverage — tarpaulin
    runs-on: [self-hosted, mini]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: cargo tarpaulin --workspace --out xml --skip-clean --timeout 300
        timeout-minutes: 20
      - uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  bench:
    name: Benchmarks — regression check
    runs-on: [self-hosted, mini]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run benchmarks on PR branch
        run: |
          cargo bench --workspace --no-fail-fast -- --output-format bencher 2>&1 | tee bench-pr.txt
      - name: Run benchmarks on base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          cargo bench --workspace --no-fail-fast -- --output-format bencher 2>&1 | tee bench-base.txt
          git checkout -
      - name: Check for regressions (>10%)
        run: |
          python3 - <<'PYEOF'
          import re, sys

          def parse_bench(path):
              results = {}
              with open(path) as f:
                  for line in f:
                      m = re.match(r'^test (\S+)\s+\.\.\. bench:\s+([\d,]+) ns/iter', line)
                      if m:
                          name = m.group(1)
                          ns = int(m.group(2).replace(',', ''))
                          results[name] = ns
              return results

          base = parse_bench('bench-base.txt')
          pr = parse_bench('bench-pr.txt')
          regressions = []
          for name in sorted(set(base) & set(pr)):
              if base[name] == 0:
                  continue
              pct = ((pr[name] - base[name]) / base[name]) * 100
              if pct > 10:
                  regressions.append(f"  {name}: {base[name]}ns → {pr[name]}ns (+{pct:.1f}%)")
          if regressions:
              print("::warning::Benchmark regressions >10% detected:")
              for r in regressions:
                  print(r)
              sys.exit(1)
          else:
              print("No benchmark regressions >10% detected.")
          PYEOF

  wasm:
    name: WASM — build ML-DSA crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build crates/evaporchain-crypto-wasm --target web --release --out-dir ../../extension/src/crypto/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: extension/src/crypto/wasm/

  extension:
    name: Extension — typecheck and build
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: extension/src/crypto/wasm/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: extension
        run: npm ci
      - working-directory: extension
        run: npx tsc --noEmit
      - working-directory: extension
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
