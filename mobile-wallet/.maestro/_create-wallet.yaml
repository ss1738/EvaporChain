# _create-wallet.yaml — Reusable sub-flow that walks the multi-step create
# flow end-to-end, ending on the Unlock screen. Other specs `runFlow:` this.
#
# Mirrors the extension's CreateAccount flow but adapted to mobile's
# 5-step UI (generate → backup → confirm 3 random seed words → set PIN →
# confirm PIN). The browser extension uses a single password instead of a
# 6-digit PIN; Maestro flows below pin = "123456" everywhere.
#
# This flow does NOT launch the app or perform any teardown — callers
# decide when to clear state (`clearState`) and when to launch.

appId: com.evaporchain.wallet
---
# 1. Welcome screen — tap "Create New Wallet"
- assertVisible:
    id: "welcome-create-wallet"
- tapOn:
    id: "welcome-create-wallet"

# 2. Generate step — tap "Show Seed Phrase"
- assertVisible:
    id: "create-show-seed-button"
- tapOn:
    id: "create-show-seed-button"

# 3. Backup step — capture all 24 seed words from the on-screen grid into
#    output.seed1..seed24 then roll up to output.seedWords (JSON array).
- assertVisible:
    id: "create-seed-grid"
- runScript: scripts/capture_seed.js
- runScript: scripts/serialize_seed.js
- tapOn:
    id: "create-backup-done-button"

# 4. Confirm step — three random `create-confirm-word-input-{i}` fields
#    are rendered (i in 0..23). Maestro YAML can't loop, so we unroll all
#    24 indices. Each iteration:
#      a. lookup_confirm_word.js → output.word = seedWords[INDEX]
#      b. tapOn(input testID) — guarded by `when: visible:` so missing
#         indices are no-ops
#      c. inputText(${output.word}) — same guard
#    Maestro evaluates env-var references at step time, so output.word
#    correctly reflects the just-completed lookup.

- runScript:
    file: scripts/lookup_confirm_word.js
    env:
      INDEX: "0"
      SEED_WORDS: ${output.seedWords}
- tapOn:
    id: "create-confirm-word-input-0"
    optional: true
- inputText: ${output.word}
  when:
    visible:
      id: "create-confirm-word-input-0"

