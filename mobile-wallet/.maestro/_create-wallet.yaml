# 5. PIN step — type "123456".
- assertVisible:
    id: "create-pin-input"
- tapOn:
    id: "create-pin-input"
- inputText: "123456"
- tapOn:
    id: "create-pin-continue-button"

# 6. PIN confirm — re-type the same PIN.
- assertVisible:
