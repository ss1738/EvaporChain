- tapOn:
    id: "create-pin-confirm-input"
- inputText: "123456"
- tapOn:
    id: "create-finish-button"

# 7. After creation we land on the Unlock screen. Caller is responsible
#    for unlocking + asserting downstream state.
- assertVisible:
    id: "unlock-pin-pad"
