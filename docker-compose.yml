version: "3.9"

x-node: &node-defaults
  build: .
  restart: unless-stopped
  environment:
    RUST_LOG: info

services:
  validator-0:
    <<: *node-defaults
    container_name: evaporchain-validator-0
    command:
      - --api
      - --api-port
      - "8080"
      - --network
      - --tendermint
      - --port
      - "26656"
      - --node-id
      - validator-0
      - --validator-id
      - "0"
      - --validators
      - "4"
      - --data-dir
      - /data/evaporchain
      - --genesis-config
      - /etc/evaporchain/genesis.json
      - --demo
      - --bootstrap-peers
      - validator-1:26656,validator-2:26656,validator-3:26656
    ports:
      - "8080:8080"
      - "26656:26656"
    volumes:
      - validator0-data:/data/evaporchain

  validator-1:
    <<: *node-defaults
    container_name: evaporchain-validator-1
    command:
      - --api
      - --api-port
      - "8080"
      - --network
      - --tendermint
      - --port
      - "26656"
      - --node-id
      - validator-1
      - --validator-id
      - "1"
      - --validators
      - "4"
      - --data-dir
      - /data/evaporchain
      - --genesis-config
      - /etc/evaporchain/genesis.json
      - --demo
      - --bootstrap-peers
      - validator-0:26656,validator-2:26656,validator-3:26656
    ports:
      - "8081:8080"
    volumes:
      - validator1-data:/data/evaporchain

  validator-2:
    <<: *node-defaults
    container_name: evaporchain-validator-2
    command:
      - --api
      - --api-port
      - "8080"
      - --network
      - --tendermint
      - --port
      - "26656"
      - --node-id
      - validator-2
      - --validator-id
      - "2"
      - --validators
      - "4"
      - --data-dir
      - /data/evaporchain
      - --genesis-config
      - /etc/evaporchain/genesis.json
      - --demo
      - --bootstrap-peers
      - validator-0:26656,validator-1:26656,validator-3:26656
    ports:
      - "8082:8080"
    volumes:
      - validator2-data:/data/evaporchain

  validator-3:
    <<: *node-defaults
    container_name: evaporchain-validator-3
    command:
      - --api
      - --api-port
      - "8080"
      - --network
      - --tendermint
      - --port
      - "26656"
      - --node-id
      - validator-3
      - --validator-id
      - "3"
      - --validators
      - "4"
      - --data-dir
      - /data/evaporchain
      - --genesis-config
      - /etc/evaporchain/genesis.json
      - --demo
      - --bootstrap-peers
      - validator-0:26656,validator-1:26656,validator-2:26656
    ports:
      - "8083:8080"
    volumes:
      - validator3-data:/data/evaporchain

volumes:
  validator0-data:
  validator1-data:
  validator2-data:
  validator3-data:
