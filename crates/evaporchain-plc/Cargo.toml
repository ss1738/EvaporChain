description = "Topological Light Clients (PLC). Light-client state is a persistent-homology barcode summary of the energy-filtered chain, not a list of headers. By the Cohen-Steiner-Edelsbrunner-Harer 2007 stability theorem, barcode bottleneck distance is bounded by interleaving distance — gives free tamper-evidence between blocks. Sublinear-in-history light-client state. Tier-3 specialized primitive (per INVENTION_STACK §4.3 'Topological Light Clients (PLC, derives from EFH)')."

