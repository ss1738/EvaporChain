evaporchain-proving = { path = "../evaporchain-proving", features = ["test-utils"] }
evaporchain-network = { path = "../evaporchain-network" }
evaporchain-da = { path = "../evaporchain-da" }
evaporchain-script = { path = "../evaporchain-script" }
