<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvaporChain — Testnet Faucet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --bg-gradient: linear-gradient(135deg, #0a0e1a 0%, #0f1629 50%, #0a0e1a 100%);
  --surface: #111827;
  --surface-hover: #1a2234;
  --border: #1e293b;
  --border-hover: #334155;
  --text: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-dim: #64748b;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.15);
  --green: #22c55e;
  --green-dim: rgba(34, 197, 94, 0.12);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.10);
  --purple: #8b5cf6;
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  background-image: var(--bg-gradient);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.container {
  width: 100%;
  max-width: 480px;
  padding: 0 24px;
}

.logo {
  text-align: center;
  margin-bottom: 40px;
}

.logo h1 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.logo h1 span {
  background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo p {
  color: var(--text-dim);
  font-size: 14px;
  margin-top: 8px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: var(--shadow-lg);
}

.card h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
}

.card p {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

input[type="number"] {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition);
}

input[type="number"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

input[type="number"]::placeholder {
  color: var(--text-dim);
}

/* Hide number input spinners */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type="number"] { -moz-appearance: textfield; }

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: opacity var(--transition), transform var(--transition);
}

button:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  display: none;
}

.result.success {
  display: block;
  background: var(--green-dim);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: var(--green);
}

.result.error {
  display: block;
  background: var(--red-dim);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: var(--red);
}

.result .balance {
  font-size: 24px;
  font-weight: 700;
  margin-top: 4px;
  color: var(--text);
}

.info {
  text-align: center;
  margin-top: 32px;
  font-size: 13px;
  color: var(--text-dim);
}

.info a {
  color: var(--accent);
  text-decoration: none;
}

.info a:hover {
  text-decoration: underline;
}

.amount-badge {
  display: inline-block;
  background: var(--accent-glow);
  color: var(--accent);
  padding: 2px 10px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1><span>EvaporChain</span> Testnet Faucet</h1>
    <p>Get free EVAP tokens for testing</p>
  </div>

  <div class="card">
    <h2>Request Tokens</h2>
    <p>Enter your account address to receive <span class="amount-badge">10,000 EVAP</span> testnet tokens. Rate limited to one request per address per hour.</p>

    <form id="faucetForm" onsubmit="return requestTokens(event)">
      <label for="address">Account Address (0-255)</label>
      <input type="number" id="address" name="address" min="0" max="255" placeholder="e.g. 1" required>
      <button type="submit" id="submitBtn">Request Tokens</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  <div class="info">
    <a href="/">Back to Dashboard</a>
  </div>
</div>

<script>
async function requestTokens(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  const address = parseInt(document.getElementById('address').value);

  if (isNaN(address) || address < 0 || address > 255) {
    result.className = 'result error';
    result.innerHTML = 'Please enter a valid address (0-255).';
    return false;
  }

  btn.disabled = true;
  btn.textContent = 'Requesting...';
  result.className = 'result';
  result.style.display = 'none';

  try {
    const resp = await fetch('/api/faucet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address })
    });
    const data = await resp.json();

    if (data.success) {
      result.className = 'result success';
      result.innerHTML = 'Tokens sent successfully!<div class="balance">' +
        data.balance.toLocaleString() + ' EVAP</div>';
    } else {
      result.className = 'result error';
      result.innerHTML = data.message || 'Request failed.';
    }
  } catch (err) {
    result.className = 'result error';
    result.innerHTML = 'Network error: ' + err.message;
  }

  btn.disabled = false;
  btn.textContent = 'Request Tokens';
  return false;
}
</script>
</body>
</html>
