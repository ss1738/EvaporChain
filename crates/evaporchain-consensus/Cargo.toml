[package]
name = "evaporchain-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
evaporchain-types = { path = "../evaporchain-types" }
evaporchain-consensus-types = { path = "../evaporchain-consensus-types" }
evaporchain-state = { path = "../evaporchain-state" }
evaporchain-execution = { path = "../evaporchain-execution" }
evaporchain-script = { path = "../evaporchain-script" }
evaporchain-contracts = { path = "../evaporchain-contracts" }
evaporchain-crypto = { path = "../evaporchain-crypto" }
evaporchain-da = { path = "../evaporchain-da" }
evaporchain-sharding = { path = "../evaporchain-sharding" }
evaporchain-mortis = { path = "../evaporchain-mortis" }
evaporchain-light-cone = { path = "../evaporchain-light-cone" }
evaporchain-decay-lamport = { path = "../evaporchain-decay-lamport" }
evaporchain-causal-cone = { path = "../evaporchain-causal-cone" }
evaporchain-antichain-mempool = { path = "../evaporchain-antichain-mempool" }
evaporchain-wsbf             = { path = "../evaporchain-wsbf" }
evaporchain-rg-phase-map     = { path = "../evaporchain-rg-phase-map" }
evaporchain-ib-validators    = { path = "../evaporchain-ib-validators" }
evaporchain-self-annealing   = { path = "../evaporchain-self-annealing" }
evaporchain-energy-kernel = { path = "../evaporchain-energy-kernel" }
evaporchain-mcc = { path = "../evaporchain-mcc" }
evaporchain-singh-attractor = { path = "../evaporchain-singh-attractor" }
evaporchain-tur-liveness = { path = "../evaporchain-tur-liveness" }
evaporchain-causal-chsh = { path = "../evaporchain-causal-chsh" }
evaporchain-lambda-fold = { path = "../evaporchain-lambda-fold" }
evaporchain-mev-detect = { path = "../evaporchain-mev-detect" }
evaporchain-boltzmann-stake = { path = "../evaporchain-boltzmann-stake" }
evaporchain-sanov-slashing = { path = "../evaporchain-sanov-slashing" }
evaporchain-bell-beacon = { path = "../evaporchain-bell-beacon" }
evaporchain-entropic-slashing = { path = "../evaporchain-entropic-slashing" }
blake3 = "1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3"
proptest = "1"
evaporchain-tombstone = { path = "../evaporchain-tombstone" }

[features]
# Historical test-utils gate in tendermint.rs DA self-attestation path.
# Empty default; opt-in with --features test-utils when re-introduced.
test-utils = []
# Phase 5.1 of LAMBDA_FOLD_NOVA_PLAN — opts the consensus crate into
# the real Nova IVC fold path. Without this feature the substrate
# blake3 fold runs unconditionally, regardless of the
# `lambda_fold_mode` governance flag value. With it on, the flag is
# honoured at the per-block fold call site. Gated behind a feature
# because pulling in `evaporchain-proving` with `nova` adds the heavy
# nova-snark + halo2curves transitive dep tree, so default builds
# stay fast.
lambda_fold_nova = ["evaporchain-lambda-fold/nova"]
# V1.5 leaderless block production (docs/proposals/
# leaderless-block-production-v15.md). OFF by default — gates the
# `leaderless` module (trait LeaderlessProposer + VRF eligibility) so
# the V1 leader-rotation hot path is wholly unaffected until an operator
# opts in at a fork epoch. Coexists with V1 per the draft's design.
doctrine_v1_5 = []
