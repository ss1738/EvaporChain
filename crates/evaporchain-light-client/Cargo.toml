[package]
name = "evaporchain-light-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Light Client SDK for EvaporChain. Unifies BFT commit-certificate verification (from `evaporchain-consensus::LightClientVerifier`) with Nova-IVC sublinear block-validity verification (from `evaporchain-proving::RealBlockProver::verify_with_vk_bytes`) and Verkle Merkle-proof state queries (from `evaporchain-crypto::verkle`). Foundation for browser/mobile wallets, dapps, bridges, and explorers — operationalises the Layer 5 Lambda-Fold Real Nova investment by giving third-party consumers a clean library entry point. WASM-target compatible (with `default-features = false`)."

[dependencies]
evaporchain-types            = { path = "../evaporchain-types" }
# default-features = false on crypto so the SDK's own crypto dep
# doesn't force bls-native; the SDK's own [features] table forwards
# the choice to wasm consumers via bls-portable.
evaporchain-crypto           = { path = "../evaporchain-crypto", default-features = false }
evaporchain-consensus-types  = { path = "../evaporchain-consensus-types", default-features = false }
evaporchain-lambda-fold = { path = "../evaporchain-lambda-fold", optional = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[features]
default = ["bls-native"]
# Forwarded to evaporchain-crypto + evaporchain-consensus-types. Native
# is the default for chain runtime / native consumers. WASM consumers
# disable defaults and enable bls-portable.
bls-native = [
    "evaporchain-crypto/bls-native",
    "evaporchain-consensus-types/bls-native",
]
bls-portable = [
    "evaporchain-crypto/bls-portable",
    "evaporchain-consensus-types/bls-portable",
]
# `nova` enables Nova-IVC sublinear block-validity verification. Without
# this feature, the SDK only does BFT commit-certificate verification —
# still useful for energy-floor checks and validator-set tracking, just
# not the sublinear claim. Pulls in `evaporchain-lambda-fold/nova` which
# transitively gates the `evaporchain-proving/nova` path.
nova = ["dep:evaporchain-lambda-fold", "evaporchain-lambda-fold/nova"]

[dev-dependencies]
proptest = "1"
