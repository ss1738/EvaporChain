[package]
name = "evaporchain-mev-detect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MEV-shaped pattern detector for EvaporChain blocks. Phase 1 of CROOKS_MEV_INTEGRATION_PLAN.md — no-op observation pipeline that surfaces sandwich/front-run-shaped transaction triples for downstream Crooks-fluctuation refund computation. Intentionally conservative to keep false-positive rate low; precision tightening + confidence scoring is Phase 4."

[dependencies]
evaporchain-types = { path = "../evaporchain-types" }
# Phase 2 of CROOKS_MEV_INTEGRATION_PLAN.md — pmf math wraps the
# already-shipped Crooks-fluctuation primitives in evaporchain-cfm
# and evaporchain-crooks-mev-refund.
evaporchain-cfm = { path = "../evaporchain-cfm" }
evaporchain-crooks-mev-refund = { path = "../evaporchain-crooks-mev-refund" }
# Phase 3.2 — deterministic digest of (observations, attacker_stats)
# uses blake3 (already a workspace dep, fast 256-bit hash).
blake3 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
