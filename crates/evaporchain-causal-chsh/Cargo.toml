[package]
name = "evaporchain-causal-chsh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Causal-CHSH — Bell-style cartel-detection bound for blockchain causal sets. Computes the four-term S statistic over concurrent block pairs in the LightCone DAG. Theorem: S ≤ 2 under honest validators + LightCone causality + single-λ decay. Violation S > 2 ⇒ hidden cross-validator coordination. ✅ GATE PASS: 200-block real-Eth (S_honest=0.012) + 3K confirm (S_honest=0.0175); INVENTION_STACK.md §A1.10 Tier-0-supporting verdict locked 2026-05-04."

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "causal_chsh_run_gate"
path = "src/bin/run_gate.rs"
