[package]
name = "evaporchain-causal-chsh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lane O.6 CLI driver wiring the full Causal-CHSH stack: read JSON honest sample (ConcurrentPairSamples) from a file or stdin, run the doctrine sweep over the three cartel models, render to GATE_RESULT.md markdown, write to stdout or a target file. Pure stdlib; no clap/structopt dependency."

[lib]
path = "src/lib.rs"

[[bin]]
name = "evaporchain-causal-chsh"
path = "src/main.rs"

[dependencies]
evaporchain-types = { path = "../evaporchain-types" }
evaporchain-causal-chsh = { path = "../evaporchain-causal-chsh" }
evaporchain-causal-chsh-sweep = { path = "../evaporchain-causal-chsh-sweep" }
evaporchain-causal-chsh-renderer = { path = "../evaporchain-causal-chsh-renderer" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
