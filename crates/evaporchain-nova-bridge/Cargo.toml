[package]
name = "evaporchain-nova-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "T0.10 Path A — bridge between chain-side Nova RecursiveSNARK and L1 Groth16-on-BN254 verifier"

# This crate is Phase 2.1 of the T0.10 Path A pivot (Nova-based bridge
# architecture). See `DESIGN.md` next to this Cargo.toml for the full
# rationale + open research questions. Scaffold-only at this commit —
# no working verifier yet.

[dependencies]
# Arkworks side: the wrapper circuit + Groth16 prover live here.
# Same versions as `ethereum-bridge/wrapper/Cargo.toml` so a future
# merge / shared-dep refactor stays straightforward.
ark-bn254              = "0.5"
ark-crypto-primitives  = { version = "0.5", features = ["sponge", "r1cs"] }
ark-ec                 = "0.5"
ark-ff                 = "0.5"
ark-r1cs-std           = { version = "0.5", default-features = false }
ark-relations          = "0.5"
ark-serialize          = "0.5"
ark-std                = "0.5"

# Nova side: the chain's existing nova-snark v0.68 (same major as
# `evaporchain-proving`). Phase 2.1 only consumes RecursiveSNARK +
# its associated public-params shapes; later phases add CompressedSNARK.
nova-snark = { version = "0.68", features = ["test-utils"] }

# Type-system glue (matching `evaporchain-proving`).
ff            = "0.13"
generic-array = "1"

# Misc.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode 1 matches the version pinned by `evaporchain-proving::nova`
# (for CompressedProof serialization). Same major used here for the
# RecursiveSNARK fixture round-trip.
bincode    = "1"
thiserror  = "1"

[dev-dependencies]
rand = "0.8"
