[package]
name = "evaporchain-nova-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "T0.10 Path A — bridge between chain-side Nova RecursiveSNARK and L1 Groth16-on-BN254 verifier"

# T0.10 Path A (Nova-based bridge architecture). See `DESIGN.md` for
# the architecture rationale + milestone table, and `README.md` for
# the module/binary navigation guide.
#
# Current SCAFFOLD_VERSION: `phase-2.2-section-1`. Section 1 is done
# (off-circuit `validate_structurally` gate); Section 2 constants
# layer is byte-correct vs neptune end-to-end; residual sponge-
# framing gap + Section 3 RelaxedR1CS remain BESPOKE.

[dependencies]
# Arkworks side: the wrapper circuit + Groth16 prover live here.
# Same versions as `ethereum-bridge/wrapper/Cargo.toml` so a future
# merge / shared-dep refactor stays straightforward.
ark-bn254              = "0.6"
ark-crypto-primitives  = { version = "0.6", features = ["sponge", "constraints"] }
ark-ec                 = "0.6"
ark-ff                 = "0.6"
ark-groth16            = "0.6"
ark-r1cs-std           = { version = "0.6", default-features = false }
ark-relations          = "0.6"
ark-serialize          = "0.6"
ark-snark              = "0.6"
ark-std                = "0.6"

# Nova side: the chain's existing nova-snark v0.68 (same major as
# `evaporchain-proving`). Phase 2.1 only consumes RecursiveSNARK +
# its associated public-params shapes; later phases add CompressedSNARK.
nova-snark = { version = "0.68", features = ["test-utils"] }

# Type-system glue (matching `evaporchain-proving`).
ff            = "0.13"
group         = "0.13"
generic-array = "1"

# Misc.
hex        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode 1 matches the version pinned by `evaporchain-proving::nova`
# (for CompressedProof serialization). Same major used here for the
# RecursiveSNARK fixture round-trip.
bincode    = "1"
thiserror  = "1"

[dev-dependencies]
rand = "0.8"
