[package]
name = "evaporchain-oracle"
version.workspace = true
edition = "2021"

[lib]
name = "evaporchain_oracle"
path = "src/lib.rs"

[[bin]]
name = "evaporchain-oracle"
path = "src/main.rs"

[dependencies]
evaporchain-crypto = { path = "../evaporchain-crypto" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
