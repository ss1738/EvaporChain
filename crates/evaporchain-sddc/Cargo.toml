description = "Singh Decay-Dutch Continuous Auction (SDDC). Joint clearing on (price, λ-tolerance) — bidders commit a max price AND a max decay rate they'll accept; high-λ-tolerant bidders win cheaper assets that decay faster. Foundational marketplace mechanism per INVENTION_STACK.md §A5.2 — reused by SAP, SCL, SFSV, SHLM."

