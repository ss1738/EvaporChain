[package]
name = "evaporchain-light-client-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bridge for the EvaporChain Light Client SDK. Browser wallets / dapps / explorers verify chain state in-browser via wasm-bindgen async functions backed by gloo-net::http::Request (browser fetch). Mirrors the standalone-Cargo-project pattern of evaporchain-crypto-wasm — NOT a workspace member, so wasm-specific compile flags don't bleed into the main workspace."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evaporchain-light-client = { path = "../evaporchain-light-client" }
wasm-bindgen        = "0.2"
wasm-bindgen-futures = "0.4"
js-sys              = "0.3"
gloo-net            = { version = "0.5", default-features = false, features = ["http", "json"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
serde-wasm-bindgen  = "0.6"
hex                 = "0.4"
# `getrandom` with "js" feature so any rand-using deps in the SDK
# graph compile against the browser's Web Crypto API instead of
# erroring on no-syscall-available. Standard pattern for wasm32.
getrandom           = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
