description = "IB Validators V2 — locked invention #5 hardening. V1 ships per-validator IB vote gate (Commit/Abstain on KL vs prior). V2 wraps the gate with a structural jail layer: validators active during a CHSH-failed window jail; validators below energy floor jail; explicit slashes jail. JailState is BTreeMap-canonical; jail expiry is deterministic on epoch. Closes the validator-set side of the Bell-Beacon V2 plumbing."

