[package]
name = "evaporchain-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rand = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
blake3 = "1"
sha2 = "0.10"
pasta_curves = "0.5"
# Pinned exact (=) per audit H-13 — `pqc_dilithium` upstream is unaudited.
# Any version bump must go through manual security review before merge.
pqc_dilithium = { version = "=0.2.0", features = ["mode3"] }
blst = "0.3"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
k256 = { version = "0.13", features = ["ecdsa-core", "ecdsa"] }

[dev-dependencies]
proptest = "1"
