[package]
name = "evaporchain-sfsv-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SFSV off-chain coordinator. Polls the node for active vault listings, accepts bids via HTTP, runs SDDC Dutch auction clearing off-chain, and submits record_sale transactions back to the chain. First reference dApp coordinator per INVENTION_STACK.md §A5.2."

[lib]
name = "evaporchain_sfsv_coordinator"
path = "src/lib.rs"

[[bin]]
name = "sfsv-coordinator"
path = "src/main.rs"

[dependencies]
evaporchain-sfsv   = { path = "../evaporchain-sfsv" }
evaporchain-sddc   = { path = "../evaporchain-sddc" }
evaporchain-types  = { path = "../evaporchain-types" }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror  = { workspace = true }
hex        = { workspace = true }
axum       = { version = "0.7" }
reqwest    = { version = "0.12", features = ["json"] }
