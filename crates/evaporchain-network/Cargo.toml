[package]
name = "evaporchain-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
evaporchain-types = { path = "../evaporchain-types" }
evaporchain-da = { path = "../evaporchain-da" }
evaporchain-crypto = { path = "../evaporchain-crypto" }
tokio = { workspace = true }
tracing = { workspace = true }
# tracing-subscriber: needed by src/bin/shard-sample-flood.rs (operator
# harness binary). The crate library itself does not call into it.
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
libp2p = { version = "0.55", features = [
    "tokio",
    "gossipsub",
    "mdns",
    "noise",
    "tcp",
    "tls",
    "yamux",
    "macros",
    "identify",
    "request-response",
    "json",
] }
futures = "0.3"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3"
